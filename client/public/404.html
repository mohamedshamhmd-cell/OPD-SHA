<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OPD SHA Hospital</title>
    <script>
      // Single Page Application Redirect for GitHub Pages
      // When a user lands on a deep URL (e.g. /OPD-SHA/sorting), GitHub Pages serves this 404.html.
      // We capture the path and redirect back to the base /OPD-SHA/ keeping the state in sessionStorage.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to OPD SHA Hospital...</p>
  </body>
</html>
