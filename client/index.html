    <meta name="description" content="OPD SHA Hospital - Smart Queue Management, Doctor Appointments, and Accessible Navigation Companion for Government Hospitals." />
    <title>OPD SHA Hospital • OPD Queue, Doctor Appointments & Navigation</title>
    <!-- Single Page App script for GitHub Pages -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
